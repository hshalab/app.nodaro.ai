name: Community Image

# Builds + publishes the prebuilt Community edition image so `docker compose
# up` on a fresh machine PULLS instead of compiling for 5-10 minutes.
#
# Runs ONLY in the public mirror (nodaroai/app.nodaro.ai) — same pattern as
# the npm publish workflow: the internal repo always skips, the mirror sync
# carries this file over, and the package publishes from public code only.
#
# The baked VITE_* values are the community-compose localhost defaults (the
# frontend inlines them at build time — root CLAUDE.md Deployment rule). A
# deployment on a real domain, or one with fresh minted keys, rebuilds
# locally: docker compose -f docker-compose.community.yml build.
#
# ONE-TIME manual step after the first publish: flip the ghcr package
# visibility to Public (org → Packages → nodaro-community → settings) —
# GitHub creates it private by default and anonymous pulls 403 until then.

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "backend/**"
      - "frontend/**"
      - "packages/**"
      - "supabase/migrations/**"
      - ".github/workflows/community-image.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: Build + push ghcr community image
    if: github.repository == 'nodaroai/app.nodaro.ai'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # amd64 + arm64 (Apple Silicon / Graviton). The arm64 half builds
          # under QEMU and is slow (~1h) — acceptable for a per-main-push
          # publish; the Dockerfile already carries per-arch ffmpeg pins.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/nodaroai/nodaro-community:latest
            ghcr.io/nodaroai/nodaro-community:${{ github.sha }}
          build-args: |
            VITE_API_URL=http://localhost:3000
            VITE_EDITION=community
            VITE_SUPABASE_URL=http://localhost:3000/supabase
            VITE_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzU0Nzg0MDAwLCJleHAiOjIwNzAxNDQwMDB9.Z1_aDD7opHbwv6f8yrHK0ptlIM2tg1ulhXsggLuDyqo
          cache-from: type=gha
          cache-to: type=gha,mode=max
